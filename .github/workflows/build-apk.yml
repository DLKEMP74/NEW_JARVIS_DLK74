name: Build Standalone JARVIS APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Stage Web Assets
        run: |
          mkdir -p www
          cp index.html www/
          # Copy extra static assets if they exist in repo root
          cp -r *.png *.jpg *.jpeg *.json www/ 2>/dev/null || true

      - name: Install Dependencies
        run: npm install

      - name: Add Android Platform
        run: |
          npx cap add android
          # Inject background audio, wake lock, and camera permissions
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-DLK74-Standalone-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
