version: '3.8'

services:
  jarvis-hud:
    image: nginx:alpine
    container_name: jarvis-hud
    ports:
      - "8080:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: jarvis-ollama
    ports:
      - "11434:11434"
    volumes:
      # Model weights saved directly to Drive 2 NVMe
      - /mnt/agent_storage/ollama_models:/root/.ollama
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: jarvis-webui
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      # Context, DB, and RAG data saved to Drive 3 SATA
      - /mnt/agent_memory/open-webui-data:/app/backend/data
      # Direct mount of your Obsidian Markdown Vault
      - /mnt/agent_memory/vault:/app/backend/data/vault
    depends_on:
      - ollama
    restart: unless-stopped
